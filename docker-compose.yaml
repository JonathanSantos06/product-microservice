  services:
    mongodb:
      image: mongo:8.0
      container_name: spring-mongo-db
      restart: unless-stopped
      environment:
        MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
        MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
        GLIBC_TUNABLES: "glibc.pthread.rseq=1"
      ports:
        - "127.0.0.1:27017:27017"
      volumes:
        - mongo_data:/data/db
      healthcheck:
        test:
          - CMD
          - mongosh
          - --quiet
          - --eval
          - "db.adminCommand('ping').ok"
        interval: 10s
        timeout: 5s
        retries: 10

    app:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: spring-mongo-app
      restart: unless-stopped
      environment:
        SPRING_MONGODB_URI: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/productdb?authSource=admin"
      ports:
        - "8080:8080"
      depends_on:
        mongodb:
          condition: service_healthy

  volumes:
    mongo_data:
